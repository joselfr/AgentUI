name: CodeQL

# Static analysis of the code (GitHub CodeQL): injections, path traversal, unsafe sandboxes, secrets in code,
# weak crypto, unsafe workflows… Results are in the repository's Security tab, "Code scanning".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload the results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript   # server, web app, runtime, OpenClaw plugin
          - python                  # Hermes plugin
          - actions                 # the workflows themselves
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
