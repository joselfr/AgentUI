name: agentui-platform
label: AgentUI
kind: platform
version: 0.1.0
license: MIT
description: >
  AgentUI channel for Hermes Agent: the Hermes gateway connects to AgentUI
  (outgoing WebSocket) and relays messages, streaming, tools, approvals
  and proactive messages (crons) using the AgentUI Channel Protocol v1.
author: AgentUI
requires_env:
  - name: AGENTUI_URL
    description: "WebSocket URL of the AgentUI gateway (e.g. wss://agentui.example.com/gateway)"
    prompt: "URL AgentUI"
    password: false
  - name: AGENTUI_TOKEN
    description: "Agent token declared in AgentUI's agents.config.yaml"
    prompt: "Token AgentUI"
    password: true
optional_env:
  - name: AGENTUI_NAME
    description: "Name displayed in AgentUI (default: Hermes)"
    prompt: "Display name"
    password: false
  - name: AGENTUI_HOME_CHANNEL
    description: "Chat that receives the deliver=agentui crons (default: home = AgentUI's \"home\" chat)"
    prompt: "Home chat"
    password: false
