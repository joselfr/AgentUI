<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>AgentUI</title>
<style>
  :root { color-scheme: light dark; --bg: #fff; --fg: #1b1d22; --accent: #3b5bdb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0e1015; --fg: #e6e8ee; --accent: #8fa4ff; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, sans-serif; text-align: center; }
  a { color: var(--accent); }
  #back { display: none; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <p id="msg">Fermeture de la fenêtre…</p>
  <p id="back"><a id="link" href="/">Revenir à AgentUI</a></p>
</main>
<script>
  // Only a same-origin path is accepted for the fallback link (no "//host", no scheme).
  var to = new URLSearchParams(location.search).get('to') || '/';
  if (to.charAt(0) !== '/' || to.charAt(1) === '/' || to.indexOf('\\') !== -1 || /[\u0000-\u001f]/.test(to)) to = '/';
  document.getElementById('link').href = to;
  setTimeout(function () {
    window.close();
    // Still here: the tab was not opened by a script, so the browser refuses to close it.
    setTimeout(function () {
      if (window.closed) return;
      document.getElementById('msg').textContent = 'Vous pouvez fermer cette fenêtre.';
      document.getElementById('back').style.display = 'block';
    }, 400);
  }, 50);
</script>
</body>
</html>
