# Copy to agents.config.yaml. ${VARIABLES} are read from the environment (.env).
# Each agent is linked by a channel plugin (plugins/): the platform is the one that connects to AgentUI on /gateway.
# The same token is declared on the platform side (Hermes: AGENTUI_TOKEN; OpenClaw: channels.agentui.token).
agents:
  - id: hermes
    type: gateway
    name: Hermes
    token: ${AGENTUI_HERMES_TOKEN}
  # - id: openclaw
  #   type: gateway
  #   name: OpenClaw
  #   token: ${AGENTUI_OPENCLAW_TOKEN}
