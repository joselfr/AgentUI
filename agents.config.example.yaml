# Copier en agents.config.yaml. Les ${VARIABLES} sont lues dans l'environnement (.env).
# Chaque agent est relié par un plugin canal (plugins/) : c'est la plateforme qui se connecte à AgentUI sur /gateway.
# Le même token est déclaré côté plateforme (Hermes : AGENTUI_TOKEN ; OpenClaw : channels.agentui.token).
agents:
  - id: hermes
    type: gateway
    name: Hermes
    token: ${AGENTUI_HERMES_TOKEN}
  # - id: openclaw
  #   type: gateway
  #   name: OpenClaw
  #   token: ${AGENTUI_OPENCLAW_TOKEN}
