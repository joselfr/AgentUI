# Copier en agents.config.yaml. Les ${VARIABLES} sont lues dans l'environnement (.env).
agents:
  - id: hermes
    type: hermes
    name: Hermes
    url: http://127.0.0.1:8642
    apiKey: ${HERMES_API_KEY}
    profiles: [default]
